name: Signature

on:
  push:
    branches: [master]
    paths:
      - 'embedded/signature/**'
      - '.github/workflows/signature.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'embedded/signature/**'
      - '.github/workflows/signature.yml'
  # No cron: nightly.yml calls this, so the nightly stays one run and one triage writer
  workflow_call:
    inputs:
      caller_run_id:
        description: 'run id of the calling workflow; keeps a called run in its own concurrency group'
        type: string
        default: ''
  workflow_dispatch:

# github.workflow is the CALLER's name in a called workflow, so hardcode ours
concurrency:
  group: ${{ inputs.caller_run_id && format('signature-call-{0}', inputs.caller_run_id) || format('signature-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.caller_run_id }}

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/_resolve-wolfssl.yml
    with:
      stable_count: 1

  signature:
    needs: resolve
    name: Run / ${{ matrix.example }} wolfSSL ${{ matrix.wolfssl_ref }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [embedded/signature]
        wolfssl_ref: ${{ fromJson(needs.resolve.outputs.refs_json) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The signature Makefiles set WOLFROOT and compile the needed
      # wolfcrypt sources directly, so they need a wolfSSL source tree
      # rather than an installed library.
      - name: Fetch wolfSSL
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/git-clone-retry.sh" -q --depth 1 --branch '${{ matrix.wolfssl_ref }}' https://github.com/wolfSSL/wolfssl /tmp/wolfssl

      # Builds and runs every example for each math/arch option and exits
      # non-zero on any FAIL; unsupported combinations are reported as N/A.
      - name: Build and run
        run: ./${{ matrix.example }}/verify_signature.sh /tmp/wolfssl /tmp/signature-logs

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signature-logs-${{ matrix.wolfssl_ref }}
          path: /tmp/signature-logs
